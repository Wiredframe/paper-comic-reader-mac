# Builds Paper Comic Reader when a version tag is pushed and attaches the app to a GitHub release. The tag drives it, so cutting a release is `git tag v1.2.3 && git push --tags`.
#
# The build is ad-hoc signed and not notarised, on purpose: notarising would tie every release
# to a paid Apple Developer membership. The release notes tell users how to get past Gatekeeper.
# No secrets are needed, so this runs on a fork or a fresh clone as-is.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The Xcode project is generated from project.yml.
      - name: Install XcodeGen
        run: brew install xcodegen

      # /Applications/Xcode.app on the runner images is not necessarily the newest one, and an
      # older toolchain fails on things as basic as @MainActor. Pick the highest version that is
      # actually installed, and say which one, so a future failure is diagnosable from the log.
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      # The paper effect is a Metal CIKernel, so the Metal toolchain has to be present. It is
      # part of some runner images already; downloading it is a no-op when it is.
      - name: Ensure the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      # The unit tests run outside the app, against a temporary folder (see PaperComicTests).
      - name: Test
        run: |
          xcodegen generate --quiet
          xcodebuild -project PaperComicReader.xcodeproj -scheme "Paper Comic Reader" \
            -destination 'platform=macOS' test

      - name: Build and package
        run: |
          chmod +x scripts/release.sh
          scripts/release.sh build/release

      - name: Collect release facts
        id: facts
        run: |
          ARCHIVE=$(ls build/release/*.zip | head -1)
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.facts.outputs.archive }}
          SHA: ${{ steps.facts.outputs.sha }}
        run: |
          NOTES=$(cat <<EOF
          ## Install

          \`\`\`
          brew tap wiredframe/tap
          brew trust --cask wiredframe/tap/paper-comic-reader
          brew install --cask paper-comic-reader
          \`\`\`

          Or download the zip below and move \`Paper Comic Reader.app\` into \`/Applications\`.

          The app is signed but not notarised. The cask clears the quarantine flag for you;
          after a manual download, open it once via right-click → **Open**, or clear it:
          \`xattr -dr com.apple.quarantine "/Applications/Paper Comic Reader.app"\`

          SHA-256: \`$SHA\`
          EOF
          )
          # Idempotent: a re-run, or a release already made by hand, updates the asset instead
          # of failing on "release already exists".
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Paper Comic Reader ${GITHUB_REF_NAME#v}" --notes "$NOTES"
            gh release upload "${GITHUB_REF_NAME}" "$ARCHIVE" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$ARCHIVE" \
              --title "Paper Comic Reader ${GITHUB_REF_NAME#v}" \
              --notes "$NOTES"
          fi
